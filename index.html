<!DOCTYPE html>
<!-- index.html: Sayfanın iskeleti. Tüm yapı burada başlar. -->
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Araçları Paneli</title>

  <!-- Görünümü buradan bağlıyoruz (style.css) -->
  <link rel="stylesheet" href="style.css" /> 
</head>

<body>
  <!-- Sağ üst köşe: silinen araçlar menüsü. İçeriğini app.js doldurur. -->
  <div class="silinen-alani">
    <button id="silinen-btn" class="silinen-btn">🗑 Silinen Araçlar (0)</button>
    <div id="silinen-liste" class="silinen-liste gizli"></div>
  </div>

  <header>
    <h1>🤖 AI Araçları Paneli</h1>
    <p>Yapay zeka araçlarını tek ekranda toplayan basit bir panel.</p>
    <!-- Tema butonu: metnini ve temayı app.js yönetir. -->
    <button id="tema-btn" class="tema-btn">🌙 Koyu tema</button>
  </header>

  <!-- Özet kutuları: toplam ve favori araç sayısı (app.js günceller). -->
  <section class="ozet-alani">
    <div class="ozet-kutu">Toplam Araç <strong id="ozet-toplam">0</strong></div>
    <div class="ozet-kutu">Favoriler <strong id="ozet-favori">0</strong></div>
  </section>

  <!-- Arama + kategori filtresi: kendi başına anlamlı bir bölüm (<section>). -->
  <section class="arama-alani">
    <input
      type="text"
      id="arama"
      class="arama-kutusu"
      placeholder="Araç ara... (örn. chat)"
    />
    <!-- Kategori menüsü boş; seçenekleri app.js verisinden dolduracak. -->
    <select id="kategori" class="arama-kutusu"></select>
  </section>

  <!-- Yeni araç ekleme: buton formu açar/kapatır, form app.js'e bağlıdır. -->
  <section class="ekle-alani">
    <button id="ekle-ac-btn" class="ekle-ac-btn">➕ Yeni Araç Ekle</button>
    <form id="ekle-form" class="ekle-form gizli">
      <input id="ekle-name" class="ekle-alan" placeholder="Ad (zorunlu)" />
      <input id="ekle-category" class="ekle-alan" placeholder="Kategori" />
      <input id="ekle-purpose" class="ekle-alan" placeholder="Kullanım amacı" />
      <input id="ekle-owner" class="ekle-alan" placeholder="Geliştiren" />
      <input id="ekle-note" class="ekle-alan" placeholder="Not" />
      <input id="ekle-url" class="ekle-alan" placeholder="Site adresi (URL) — isteğe bağlı" />
      <div class="ekle-aksiyonlar">
        <button type="submit" class="ekle-btn">Ekle</button>
        <button type="button" id="ekle-iptal-btn" class="ekle-iptal-btn">İptal</button>
      </div>
    </form>
  </section>

  <!-- Sayfanın ana içeriği: kartları app.js içindeki renderTools() dolduracak.
       DİKKAT: Arama kutusu buraya konmaz; renderTools() <main> içini siler. -->
  <main></main>

  <!-- Alt bilgi: proje hakkında kısa not. -->
  <footer class="alt-bilgi">
    <p>AI Araçları Paneli · Yazılım eğitimi 1. hafta projesi</p>
  </footer>

  <!-- Davranışı (JavaScript) sayfanın en sonunda bağlıyoruz -->
  <script src="app.js"></script>
</body>
</html>
